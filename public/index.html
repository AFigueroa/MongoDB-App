<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie DB</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">Movie DB</h1>

    <div id="status" class="alert d-none" role="alert"></div>

    <ul class="nav nav-tabs" id="resourceTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button
          class="nav-link active"
          id="movies-tab"
          data-bs-toggle="tab"
          data-bs-target="#movies-pane"
          type="button"
          role="tab"
        >Movies</button>
      </li>
      <li class="nav-item" role="presentation">
        <button
          class="nav-link"
          id="reviews-tab"
          data-bs-toggle="tab"
          data-bs-target="#reviews-pane"
          type="button"
          role="tab"
        >Reviews</button>
      </li>
      <li class="nav-item" role="presentation">
        <button
          class="nav-link"
          id="actors-tab"
          data-bs-toggle="tab"
          data-bs-target="#actors-pane"
          type="button"
          role="tab"
        >Actors</button>
      </li>
    </ul>

    <div class="tab-content pt-3" id="resourceTabContent">
      <div class="tab-pane fade show active" id="movies-pane" role="tabpanel">
        <h3>Movies</h3>
        <form data-resource="movies" class="row g-2 mb-3" id="movies-form">
          <div class="col-md-4">
            <input class="form-control" name="title" placeholder="Title" required />
          </div>
          <div class="col-md-2">
            <input class="form-control" name="year" type="number" placeholder="Year" required />
          </div>
          <div class="col-md-3">
            <input class="form-control" name="director" placeholder="Director" required />
          </div>
          <div class="col-md-3">
            <input class="form-control" name="genres" placeholder="Genres (comma separated)" />
          </div>
          <div class="col-md-4">
            <input class="form-control" name="cast" placeholder="Cast (comma separated)" />
          </div>
          <div class="col-md-2">
            <input class="form-control" name="runtime" type="number" placeholder="Runtime" />
          </div>
          <div class="col-md-2">
            <input
              class="form-control"
              name="rating"
              type="number"
              step="0.1"
              min="0"
              max="10"
              placeholder="Rating"
            />
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Add Movie</button>
          </div>
        </form>

        <table class="table table-striped table-sm" id="movies-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Year</th>
              <th>Director</th>
              <th>Genres</th>
              <th>Rating</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="tab-pane fade" id="reviews-pane" role="tabpanel">
        <h3>Reviews</h3>
        <form data-resource="reviews" class="row g-2 mb-3" id="reviews-form">
          <div class="col-md-3">
            <select class="form-select" name="movie_id" id="reviews-movie_id" required>
              <option value="">Select movie</option>
            </select>
          </div>
          <div class="col-md-2">
            <input class="form-control" name="user" placeholder="User" required />
          </div>
          <div class="col-md-1">
            <input
              class="form-control"
              name="rating"
              type="number"
              min="0"
              max="10"
              placeholder="Rating"
              required
            />
          </div>
          <div class="col-md-4">
            <input class="form-control" name="comment" placeholder="Comment" />
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Add Review</button>
          </div>
        </form>

        <table class="table table-striped table-sm" id="reviews-table">
          <thead>
            <tr>
              <th>Movie</th>
              <th>User</th>
              <th>Rating</th>
              <th>Comment</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="tab-pane fade" id="actors-pane" role="tabpanel">
        <h3>Actors</h3>
        <form data-resource="actors" class="row g-2 mb-3" id="actors-form">
          <div class="col-md-4">
            <input class="form-control" name="name" placeholder="Name" required />
          </div>
          <div class="col-md-2">
            <input class="form-control" name="birth_year" type="number" placeholder="Birth Year" />
          </div>
          <div class="col-md-4">
            <input class="form-control" name="nationality" placeholder="Nationality" />
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Add Actor</button>
          </div>
        </form>

        <table class="table table-striped table-sm" id="actors-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Birth Year</th>
              <th>Nationality</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
